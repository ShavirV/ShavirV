name: Update Neofetch & Metrics

on:
  schedule:
    - cron: "0 2 * * *"   # once daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Test GitHub authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import requests
      
          token = os.environ["GITHUB_TOKEN"]
      
          response = requests.get(
              "https://api.github.com/user",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              },
          )
      
          print("HTTP status:", response.status_code)
          print("Rate limit:", response.headers.get("X-RateLimit-Limit"))
          print("Rate remaining:", response.headers.get("X-RateLimit-Remaining"))
          print("Rate reset:", response.headers.get("X-RateLimit-Reset"))
      
          if response.ok:
              print("Authenticated as:", response.json().get("login"))
          else:
              print(response.text)
              raise SystemExit(1)
          PY

      - name: Fetch GitHub metrics
        run: python scripts/fetch_metrics.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SVG and README
        run: python scripts/generate_readme.py

      - name: Generate cube scramble
        run: python scripts/cube_scramble.py

      - name: Generate cube scramble
        run: python scripts/proc_modules.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add metrics.json neofetch.svg cube_scramble.svg proc_modules.svg README.md

          git commit -m "Update neofetch metrics" || exit 0

          git pull --rebase origin main
          git push origin main
